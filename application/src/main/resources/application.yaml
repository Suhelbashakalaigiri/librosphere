spring:
  application:
    name: application
  datasource:
    url: jdbc:mysql://localhost:3306/librosphere_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  #  ${DB_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      locations: "classpath*:graphql/**/"
server:
  port: 8080

